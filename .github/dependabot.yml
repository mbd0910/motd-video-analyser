version: 2

updates:
  # Python package + dev tooling (pyproject.toml / uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      python-runtime:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Astro site (site/package.json / site/package-lock.json)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "astro"
          - "@astrojs/*"
        update-types:
          - "minor"
          - "patch"

  # Workflow actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
