[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motd-analyser"
version = "0.1.0"
description = "Automated video analysis pipeline to measure coverage bias in BBC's Match of the Day"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Michael"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "opencv-python==4.12.0.88",
    "numpy>=2.0.0,<2.2.0",
    "pyyaml==6.0.3",
    "scenedetect[opencv]==0.6.7.1",
    "easyocr==1.7.2",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "torchaudio==2.9.0",
    "faster-whisper==1.1.0",
    "requests>=2.32.0",
    "click==8.1.8",
    "python-dateutil==2.9.0.post0",
    "tqdm==4.67.1",
    "packaging==24.2",
    "pydantic==2.10.3",
    "rapidfuzz==3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
motd = "motd.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motd = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (pure logic, no ML dependencies)",
    "integration: Integration tests (requires full ML stack)",
]
filterwarnings = [
    # Ignore PyTorch MPS warnings (not relevant on Linux CI runners)
    "ignore::UserWarning:torch.*",
]

# Mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "easyocr.*",
    "cv2.*",
    "scenedetect.*",
    "faster_whisper.*",
    "rapidfuzz.*",
    "torch.*",
]
ignore_missing_imports = true

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM102", # nested if statements (sometimes more readable)
    "SIM108", # ternary operator (explicit if/else preferred for readability)
]

[tool.ruff.lint.isort]
known-first-party = ["motd"]
