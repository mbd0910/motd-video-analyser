[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motd-analyser"
version = "0.1.0"
description = "Automated video analysis pipeline to measure coverage bias in BBC's Match of the Day"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Michael"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "boto3>=1.35.0",
    "click==8.1.8",
    "openai>=1.0.0",
    "pydantic>=2.13",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "boto3-stubs>=1.35.0",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
motd = "motd.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motd = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (pure logic, no external services)",
    "integration: Integration tests (requires external services)",
]

# Mypy configuration
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true


# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM102", # nested if statements (sometimes more readable)
    "SIM108", # ternary operator (explicit if/else preferred for readability)
]

[tool.ruff.lint.isort]
known-first-party = ["motd"]
